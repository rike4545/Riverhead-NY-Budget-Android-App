name: Sync canonical web data

on:
  push:
    branches:
      - main
  schedule:
    - cron: '29 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-canonical-web-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android app
        uses: actions/checkout@v4
        with:
          path: mobile

      - name: Check out canonical web source
        uses: actions/checkout@v4
        with:
          repository: rike4545/Riverhead-NY-Budget-Web-App
          path: web-source

      - name: Sync datasets from web ETL
        run: node web-source/web/scripts/sync-shared-data.mjs --consumer android --root mobile

      - name: Commit canonical data changes
        working-directory: mobile
        run: |
          # Stage first: git diff does not report untracked files, which are
          # expected when the canonical manifest adds new datasets.
          git add app/src/main/assets/data/
          if git diff --cached --quiet; then
            echo "Already in sync with web source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync canonical data from web source"
          git push
