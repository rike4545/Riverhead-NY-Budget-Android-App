name: Sync canonical web data

on:
  schedule:
    - cron: '29 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-canonical-web-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android app
        uses: actions/checkout@v7
        with:
          path: mobile

      - name: Check out canonical web source
        uses: actions/checkout@v7
        with:
          repository: rike4545/Riverhead-NY-Budget-Web-App
          path: web-source

      - name: Sync datasets from web ETL
        run: node web-source/web/scripts/sync-shared-data.mjs --consumer android --root mobile

      - name: Commit canonical data changes
        working-directory: mobile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage the whole data folder: the sync mirrors meetings, afr, history,
          # salary and subaccounts, and a fixed list here left new folders
          # written but never committed.
          git add app/src/main/assets/data
          # Check what is staged, not git diff: git diff ignores new files, so a
          # sync that only added a file (a new meeting) used to commit nothing.
          if git diff --cached --quiet; then
            echo "Already in sync with web source."
            exit 0
          fi
          git commit -m "Sync canonical data from web source"
          git push
