name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The jobs only check out code and upload logs, so the token needs no write access.
permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check out canonical web navigation
        uses: actions/checkout@v7
        with:
          repository: rike4545/Riverhead-NY-Budget-Web-App
          path: web-source

      - name: Verify Android web-feature parity
        run: node scripts/verify-web-parity.mjs web-source/web/components/SiteNav.tsx

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build and test
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
